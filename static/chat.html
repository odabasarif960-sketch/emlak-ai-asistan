<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI — Sohbet</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/chat_style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="chat-body">
    <div class="bg-glow bg-glow-1" id="dynamic-glow"></div>

    <div class="chat-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <a href="/" class="logo-small">
                <i class="fa-solid fa-layer-group"></i> Nexus
            </a>
            
            <div class="model-info" id="model-info">
                <div class="model-icon" id="model-icon">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <h2 id="model-name">Yükleniyor...</h2>
                <p id="model-desc">Asistanınız hazırlanıyor</p>
            </div>
            
            <div class="sidebar-menu">
                <button class="menu-btn active"><i class="fa-solid fa-message"></i> Yeni Sohbet</button>
                <button class="menu-btn" onclick="window.location.href='/'"><i class="fa-solid fa-arrow-left"></i> Modeller</button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-main">
            <div class="chat-header">
                <div class="status-indicator">
                    <span class="dot"></span> Çevrimiçi
                </div>
                <div class="header-actions">
                    <button id="clear-chat" title="Sohbeti Temizle"><i class="fa-solid fa-trash"></i></button>
                </div>
            </div>

            <div class="chat-messages" id="chat-messages">
                <div class="message assistant">
                    <div class="avatar"><i class="fa-solid fa-robot"></i></div>
                    <div class="bubble">Size nasıl yardımcı olabilirim?</div>
                </div>
            </div>

            <div class="chat-input-area">
                <form id="chat-form">
                    <input type="text" id="user-input" placeholder="Bir mesaj yazın..." autocomplete="off" required>
                    <button type="submit" id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
                </form>
                <div class="disclaimer">Nexus AI yanıtları yapay zeka tarafından oluşturulur, doğruluklarını teyit ediniz.</div>
            </div>
        </main>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
